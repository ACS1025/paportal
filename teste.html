<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Diagnóstico SM</title>
<style>
body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; background: #f8fafc; }
.box { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin: 12px 0; }
h3 { margin: 0 0 12px; }
label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-top: 12px; margin-bottom: 4px; }
input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
button { padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 8px; margin: 4px 4px 0 0; font-weight: 600; }
.btn-fetch { background: #3b82f6; color: white; }
.btn-jsonp { background: #22c55e; color: white; }
.btn-direct { background: #f59e0b; color: white; }
pre { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
.ok { color: #22c55e; font-weight: 600; }
.err { color: #ef4444; font-weight: 600; }
.warn { color: #f59e0b; font-weight: 600; }
.info { color: #64748b; }
#resultado { min-height: 100px; }
#resultado div { margin: 4px 0; font-size: 13px; }
</style>
<base target="_blank">
</head>
<body>

<div class="box">
  <h3>🔍 Diagnóstico — Busca por SM</h3>
  <label>Endpoint do Apps Script</label>
  <input id="endpoint" value="https://script.google.com/macros/s/AKfycbz-VPu2CEaxnrTtwItYcoeJaClpJhZsCscUfBvmY_s4oJ4fTQwykSyb0Uq7B2RMewY-/exec">
  <label>Código SM</label>
  <input id="sm" placeholder="1269564" value="1269564">
  <div style="margin-top:12px;">
    <button class="btn-fetch" onclick="testarFetch()">1️⃣ Testar FETCH</button>
    <button class="btn-jsonp" onclick="testarJSONP()">2️⃣ Testar JSONP</button>
    <button class="btn-direct" onclick="abrirDireto()">3️⃣ Abrir URL direto</button>
  </div>
</div>

<div class="box">
  <h4>📋 Resultado:</h4>
  <div id="resultado">Clique em um botão acima para testar.</div>
</div>

<script>
function limpar() {
  document.getElementById('resultado').innerHTML = '';
}
function log(tipo, msg) {
  const r = document.getElementById('resultado');
  const cor = tipo === 'ok' ? 'ok' : tipo === 'err' ? 'err' : tipo === 'warn' ? 'warn' : 'info';
  r.innerHTML += '<div class="' + cor + '">' + msg + '</div>';
  r.scrollTop = r.scrollHeight;
}

async function testarFetch() {
  limpar();
  const ep = document.getElementById('endpoint').value.trim();
  const sm = document.getElementById('sm').value.trim();
  log('info', '⏳ Testando FETCH...');
  log('info', '🔗 URL: ' + ep + '?sm=' + encodeURIComponent(sm));

  try {
    const resp = await fetch(ep + '?sm=' + encodeURIComponent(sm));
    log('ok', '✅ HTTP Status: ' + resp.status + ' ' + resp.statusText);
    const texto = await resp.text();
    log('info', '📄 Corpo (300 primeiros chars):<pre>' + texto.substring(0, 300).replace(/</g,'&lt;') + '</pre>');
    try {
      const json = JSON.parse(texto);
      log('ok', '📦 JSON parseado:<pre>' + JSON.stringify(json, null, 2).substring(0, 400).replace(/</g,'&lt;') + '</pre>');
    } catch(e) {
      log('err', '❌ Não é JSON válido: ' + e.message);
    }
  } catch(err) {
    log('err', '❌ ERRO FETCH: ' + err.name + ': ' + err.message);
    if (err.message.includes('Failed to fetch') || err.message.includes('CORS') || err.message.includes('NetworkError')) {
      log('warn', '⚠️ Isso indica problema de CORS — o FETCH não funciona no GitHub Pages/Live Server');
      log('warn', '💡 Solução: usar JSONP (botão verde)');
    }
  }
}

let cbId = 0;
function testarJSONP() {
  limpar();
  const ep = document.getElementById('endpoint').value.trim();
  const sm = document.getElementById('sm').value.trim();
  log('info', '⏳ Testando JSONP...');

  const cbName = '_test_' + (++cbId) + '_' + Date.now();
  const script = document.createElement('script');
  const t = setTimeout(() => {
    cleanup();
    log('err', '❌ JSONP Timeout (8s) — o script não respondeu');
  }, 8000);

  function cleanup() {
    clearTimeout(t);
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[cbName];
  }

  window[cbName] = function(dados) {
    cleanup();
    log('ok', '✅ JSONP funcionou!');
    log('info', '📦 Dados recebidos:<pre>' + JSON.stringify(dados, null, 2).substring(0, 500).replace(/</g,'&lt;') + '</pre>');
    if (dados.encontrado) {
      log('ok', '🎯 SM encontrado! Motorista: ' + (dados.motorista || '(vazio)'));
    } else {
      log('warn', '⚠️ SM não encontrado na planilha');
    }
  };

  script.onerror = function(e) {
    cleanup();
    log('err', '❌ JSONP falhou ao carregar o script');
    log('err', '💡 Verifique se a URL do endpoint está correta e se o Apps Script foi deployado');
  };

  script.src = ep + '?sm=' + encodeURIComponent(sm) + '&callback=' + cbName;
  log('info', '📡 Script: ' + script.src.substring(0, 120) + '...');
  document.head.appendChild(script);
}

function abrirDireto() {
  const ep = document.getElementById('endpoint').value.trim();
  const sm = document.getElementById('sm').value.trim();
  window.open(ep + '?sm=' + encodeURIComponent(sm), '_blank');
}
</script>
</body>
</html>
